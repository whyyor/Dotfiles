onboarding = false

[theme]
name = "vesper"
auto_switch = false

[theme.custom]
accent = "#1c1c1c"
overlay0 = "#505050"
panel_bg = "reset"
surface0 = "reset"
surface1 = "reset"
surface_dim = "reset"

[keys]
prefix = "ctrl+space"
goto = ""
settings = "prefix+g"

# Finders open as temporary panes, not popups: herdr always frames popups
# with a border and title, and panes (pane_borders = false) have neither.
# fzf centres itself with margins (scripts/fzf-theme.sh).
[[keys.command]]
key = ["prefix+t", "prefix+shift+f"]
type = "pane"
command = "$HOME/.local/bin/h"
description = "find folder -> workspace"

[[keys.command]]
key = "prefix+s"
type = "pane"
command = "$HOME/.local/bin/hw"
description = "switch workspace"

[[keys.command]]
key = "prefix+a"
type = "pane"
command = "$HOME/.local/bin/ha"
description = "jump to agent"

[ui]
pane_borders = false
pane_gaps = false
pane_scrollbars = false
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true
